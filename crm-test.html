<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM fictif — Fiche appelant</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#edf3f9;color:#17314c;font-family:system-ui,'Segoe UI',sans-serif}article{max-width:600px;margin:45px auto;background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 35px #1b3c6018}header{font-size:13px;color:#236ec3;font-weight:700;letter-spacing:.08em}h1{font-size:27px;margin:15px 0}p{color:#53677d}.value{font-size:28px;font-weight:700;background:#f0f5fb;border-radius:10px;padding:18px;word-break:break-all}.ok{color:#08764e;font-weight:650}.hint{font-size:13px}</style></head><body><article><header>CRM FICTIF · ENVIRONNEMENT DE TEST</header><h1>Fiche appelant</h1><p>Numéro transmis par le connecteur Webex</p><div class="value" id="number">—</div><p class="ok" id="status"></p><p class="hint">Aucune connexion au CRM MyCaelis. Cette page affiche uniquement le paramètre <code>phone</code> de l'URL. Aucun enregistrement ni recherche n'est effectué.</p></article><script>const n=new URL(location.href).searchParams.get('phone')||'';const valid=/^\+?\d{6,15}$/.test(n);document.getElementById('number').textContent=valid?n:'Numéro non renseigné ou invalide';document.getElementById('status').textContent=valid?'✓ Paramètre « phone » reçu':'Vérifier l’URL du test';</script></body></html>
