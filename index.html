
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webex CRM Connector V0.5</title>

<script src="https://unpkg.com/@webex/embedded-app-sdk@2" defer></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #eef3f8;
  font-family: Arial, sans-serif;
  color: #17283b;
}

main {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
}

h1 { font-size: 24px; }

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #c7d2df;
  border-radius: 8px;
}

input[type="checkbox"] {
  width: auto;
}

button {
  padding: 12px 16px;
  border: 0;
  background: #1766d3;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  margin: 7px 5px 7px 0;
}

button.secondary {
  background: #e7edf5;
  color: #17283b;
}

.status {
  display: inline-block;
  padding: 9px 14px;
  border-radius: 20px;
  background: #eaf1ff;
  color: #174c9d;
  font-size: 13px;
  font-weight: bold;
}

.panel {
  margin-top: 20px;
  padding: 15px;
  background: #f3f6fa;
  border-radius: 10px;
}

#log {
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

a { color: #1766d3; }
</style>
</head>

<body>
<main>

<h1>Connecteur Webex → CRM</h1>
<p>Prototype V0.5 — Diagnostic des appels entrants</p>

<div class="status" id="connection">
  Initialisation Webex...
</div>

<label>Destination CRM</label>
<select id="mode">
  <option value="test">TEST — CRM fictif</option>
  <option value="mycaelis">PRODUCTION — MyCaelis</option>
</select>

<label>
  <input type="checkbox" id="enabled" checked>
  Ouverture automatique sur appel entrant
</label>

<label>Numéro de simulation</label>
<input id="phone" value="0612345678">

<button id="simulate">Simuler une sonnerie</button>
<button id="webexTest" class="secondary">
  Tester l'ouverture via Webex
</button>
<button id="clear" class="secondary">
  Effacer le journal
</button>

<p>
  <a id="direct" href="./crm-test.html?phone=0612345678"
     target="_blank" rel="noopener">
    Ouvrir directement la fiche fictive
  </a>
</p>

<div class="panel">
  <strong>Diagnostic Webex</strong>
  <div id="diagnostic">Initialisation...</div>
</div>

<div class="panel">
  <strong>État et événements</strong>
  <div id="log"></div>
</div>

</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  let app = null;
  let webexReady = false;
  let eventsReceived = 0;

  const processedCalls = new Map();

  // Journal sans affichage du numéro complet
  function log(message) {
    const div = document.createElement("div");

    div.textContent =
      new Date().toLocaleTimeString("fr-FR")
      + " - " + message;

    $("log").prepend(div);

    while ($("log").children.length > 30) {
      $("log").lastChild.remove();
    }
  }

  function mask(value) {
    const s = String(value ?? "");
    if (!s) return "(absent)";
    return "****" + s.slice(-3);
  }

  // Normaliser le numéro téléphonique
  function normalizePhone(raw) {
    if (raw === undefined || raw === null) {
      return null;
    }

    let phone = String(raw).trim();

    phone = phone.replace(/^tel:/i, "");
    phone = phone.replace(/[\s().-]/g, "");

    if (!/^\+?[0-9]{6,15}$/.test(phone)) {
      return null;
    }

    return phone;
  }

  // Construire l'URL CRM
  function getCRMUrl(phone) {
    const number = normalizePhone(phone);

    if (!number) return null;

    let url;

    if ($("mode").value === "test") {
      url = new URL(
        "./crm-test.html",
        window.location.href
      );
    } else {
      url = new URL(
        "https://transport-rdz.mycaelis.fr/transportsanitaire/"
      );
    }

    url.searchParams.set("phone", number);

    return url.href;
  }

  function updateDiagnostic() {
    $("diagnostic").textContent =
      "Webex connecté : " +
      (webexReady ? "OUI" : "NON") +
      " | Événements reçus : " +
      eventsReceived;
  }

  // Ouverture manuelle pour les simulations
  function openLocal(url) {
    const win = window.open(
      url,
      "_blank",
      "noopener"
    );

    if (win === null) {
      log("Ouverture potentiellement bloquée.");
    } else {
      log("Ouverture locale demandée.");
    }
  }

  // Ouverture par le SDK Webex
  async function openViaWebex(url) {
    if (!webexReady || !app) {
      log("Webex non connecté.");
      return;
    }

    try {
      log("Demande d'ouverture envoyée à Webex.");

      await app.openUrlInSystemBrowser(url);

      log("Webex a accepté la commande d'ouverture.");
    } catch (error) {
      log("ERREUR ouverture Webex : " +
          String(error));
      console.error(error);
    }
  }

  // Ouvrir la fiche CRM
  async function openCRM(phone, callKey = null) {
    if (!$("enabled").checked) {
      log("Ouverture automatique désactivée.");
      return;
    }

    const url = getCRMUrl(phone);

    if (!url) {
      log("Numéro invalide : fiche non ouverte.");
      return;
    }

    // Protection contre les appels dupliqués
    const key = String(callKey || phone);
    const now = Date.now();

    if (
      processedCalls.has(key) &&
      now - processedCalls.get(key) < 15000
    ) {
      log("Événement déjà traité.");
      return;
    }

    processedCalls.set(key, now);

    for (const [k, time] of processedCalls) {
      if (now - time > 30000) {
        processedCalls.delete(k);
      }
    }

    log("Numéro valide : " + mask(phone));

    await openViaWebex(url);
  }

  // Extraire un numéro depuis les données Cisco
  function extractCallerNumber(call) {
    const candidates = [];

    if (Array.isArray(call.remoteParticipants)) {
      for (const participant of call.remoteParticipants) {
        if (!participant) continue;

        candidates.push(participant.callerID);
        candidates.push(participant.phoneNumber);
        candidates.push(participant.number);
      }
    }

    // Autres formats possibles
    candidates.push(call.remoteNumber);
    candidates.push(call.remotePhoneNumber);
    candidates.push(call.callerNumber);

    // Cisco utilise aussi call.id dans son exemple.
    // On ne le retient que s'il ressemble à un numéro.
    candidates.push(call.id);

    for (const candidate of candidates) {
      const number = normalizePhone(candidate);

      if (number) return number;
    }

    return null;
  }

  // Réception des événements Webex
  function onCallStateChanged(call) {
    eventsReceived++;
    updateDiagnostic();

    if (!call || typeof call !== "object") {
      log("Événement Webex vide.");
      return;
    }

    const state = String(call.state || "");
    const type = String(call.callType || "");

    log(
      "Événement Webex : state=" + state +
      " | type=" + type
    );

    // Uniquement un appel entrant au démarrage
    if (
      state.toLowerCase() !== "started" ||
      type.toLowerCase() !== "received"
    ) {
      return;
    }

    log("APPEL ENTRANT DÉTECTÉ !");

    const phone = extractCallerNumber(call);

    if (!phone) {
      log("Numéro introuvable dans l'événement.");

      const fields = Object.keys(call);
      log("Champs disponibles : " + fields.join(", "));

      if (Array.isArray(call.remoteParticipants)) {
        log(
          "Participants distants : " +
          call.remoteParticipants.length
        );

        for (const p of call.remoteParticipants) {
          if (p && typeof p === "object") {
            log(
              "Champs participant : " +
              Object.keys(p).join(", ")
            );
          }
        }
      }

      log("Vérifier les autorisations PII Webex.");
      return;
    }

    log("Numéro appelant identifié : " + mask(phone));

    openCRM(phone, call.id || phone);
  }

  // Bouton simulation locale
  $("simulate").addEventListener("click", () => {
    const url = getCRMUrl($("phone").value);

    if (!url) {
      log("Numéro de simulation invalide.");
      return;
    }

    log("Simulation de sonnerie.");
    openLocal(url);
  });

  // Test direct du navigateur via Webex
  $("webexTest").addEventListener("click", () => {
    const url = getCRMUrl($("phone").value);

    if (!url) {
      log("Numéro invalide.");
      return;
    }

    openViaWebex(url);
  });

  $("clear").addEventListener("click", () => {
    $("log").replaceChildren();
    eventsReceived = 0;
    processedCalls.clear();
    updateDiagnostic();
    log("Journal effacé.");
  });

  $("phone").addEventListener("input", () => {
    const url = getCRMUrl($("phone").value);

    if (url && $("mode").value === "test") {
      $("direct").href = url;
    }
  });

  $("mode").addEventListener("change", () => {
    if ($("mode").value === "mycaelis") {
      log("Mode production sélectionné.");
    }
  });

  // Initialisation du SDK Webex
  async function initializeWebex() {
    if (!window.webex?.Application &&
        !window.Webex?.Application) {

      $("connection").textContent =
        "SDK Webex non détecté";

      log("SDK Webex absent.");
      updateDiagnostic();
      return;
    }

    try {
      const SDK =
        window.webex?.Application ||
        window.Webex.Application;

      app = new SDK();

      await app.onReady();
      await app.listen();

      app.on(
        "sidebar:callStateChanged",
        onCallStateChanged
      );

      webexReady = true;

      $("connection").textContent =
        "Webex connecté — écoute active";

      log("Connexion SDK Webex réussie.");
      log("Écoute des appels activée.");

      updateDiagnostic();

    } catch (error) {
      $("connection").textContent =
        "Erreur connexion Webex";

      log("ERREUR SDK : " + String(error));
      console.error(error);
      updateDiagnostic();
    }
  }

  window.addEventListener("load", initializeWebex);

})();
</script>
</body>
</html>
